<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../assets/style.css">

</head>
<body>
    <div class="auth-page">
        <div class="login-container">
            <h2>Login</h2>
            <form id="loginForm">
                <label for="name">Email:</label><br>
                <input type="email" id="email" placeholder="Email" required>

                <label for="name">Password:</label><br>
                <input type="password" id="password" placeholder="Password" required>

                <button type="submit">Login</button>
            </form>

            <p id="errorMessage" style="color: red; display: none;"></p>

            <p>Don't have an account? <a href="../auth/registration.html">Register here</a></p>
        </div>
    </div>
    
    <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorMsg = document.getElementById('errorMessage');
        
        const res = await fetch('https://insighthub-server.onrender.com/api/login', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                email: document.getElementById('email').value,
                password: document.getElementById('password').value 
            })
        });
        
    if (res.ok) {
        const data = await res.json(); 
        
        if (data.isAdmin) {
            window.location.href = "/admin/dashboard.html";
        } else {
            window.location.href = "/search.html";
        }
    } else {
        errorMsg.textContent = "No account matches these credentials. Please check your details or register.";
        errorMsg.style.display = "block";
    }
    });
    </script>
</body>
</html>
